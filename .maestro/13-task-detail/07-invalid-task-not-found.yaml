# S13C7 - An invalid task (bad deep link) shows a not-found page instead of breaking.
appId: ${APP_ID}
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Reentry Roadmap", timeout: 45000 }
- openLink: "nexpath:///path/00000000-0000-0000-0000-000000000000/11111111-1111-1111-1111-111111111111"
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil: { visible: ".*couldn't be found.*", timeout: 15000 }
